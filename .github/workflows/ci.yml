name: CI / Production Quality Gate

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Monorepo Verification Pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Monorepo Dependencies
        run: npm install --no-audit

      - name: Linter Check (Zero Warnings Enforced)
        run: npm run lint:all

      - name: Typecheck (Strict TypeScript)
        run: npm run typecheck:all

      - name: Build All Workspaces
        run: npm run build:all

      - name: Install Playwright Chromium with System Dependencies
        run: npx playwright install --with-deps chromium

      - name: Unit & Integration Tests (Coverage >= 80%)
        run: npm run test:coverage

      - name: Playwright E2E Benchmarks & Demonstrations
        run: npm run test:e2e

      - name: Upload Test Reports & Verification Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-artifacts
          path: |
            packages/shared-e2e-harness/playwright-report/
            **/coverage/
            **/test-results/
          retention-days: 14
